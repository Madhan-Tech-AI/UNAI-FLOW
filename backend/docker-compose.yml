version: '3.8'

services:
  # FastAPI Gateway Server
  api:
    build: .
    container_name: unai_flow_gateway
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  # Background Celery Publishing Worker
  worker:
    build: .
    container_name: unai_flow_celery_worker
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2

  # Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: unai_flow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
